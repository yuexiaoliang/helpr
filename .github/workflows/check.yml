name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, local client tests, and saved evidence
        run: npm run check
      # prepare.mjs 是真实实验的准备入口；安装测试依赖时跳过生命周期脚本。
      - name: Install locked browser test dependencies
        working-directory: .scratch/helpr-first-release/experiments/runtime-flow-replay
        run: npm ci --ignore-scripts
      - name: Install Chromium for local fixtures
        working-directory: .scratch/helpr-first-release/experiments/runtime-flow-replay
        run: npx --no-install playwright install --with-deps chromium
      - name: Replay regression tests
        run: npm run test:browser
