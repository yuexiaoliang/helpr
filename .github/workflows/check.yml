name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install the frozen product graph
        run: pnpm install --frozen-lockfile
      - name: Compile the explicit process entries
        run: pnpm compile
      - name: Product and saved experiment checks
        run: pnpm check
      # 旧实验单独保留 npm 锁文件，不与正式产品共用依赖图。
      - name: Install locked browser experiment dependencies
        working-directory: .scratch/helpr-first-release/experiments/runtime-flow-replay
        run: npm ci --ignore-scripts
      - name: Install Chromium for local fixtures
        working-directory: .scratch/helpr-first-release/experiments/runtime-flow-replay
        run: npx --no-install playwright install --with-deps chromium
      - name: Replay regression tests
        run: pnpm test:browser
