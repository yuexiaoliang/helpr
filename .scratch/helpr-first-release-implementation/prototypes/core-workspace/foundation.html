<style>
/* PROTOTYPE. Three deliberately different layouts share only visual tokens and task content. */
* { box-sizing: border-box; }
[hidden] { display:none!important; }
:root { --ink:#23352e; --muted:#78817b; --line:#e3e7e0; --green:#2b594b; --soft:#edf3ee; --amber:#a26b27; --paper:#fff; --background:#eeeee9; }
body { margin:0; color:var(--ink); background:var(--background); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
button,input,textarea,select { font:inherit; }
button { cursor:pointer; border:0; background:none; color:inherit; }

button:not(:disabled):hover { filter:brightness(.95); }

svg { width:18px; height:18px; vertical-align:middle; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn { width:30px; height:30px; display:inline-grid; place-items:center; border-radius:7px; }
.icon-btn:hover { background:#edf0eb; }
.primary { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 15px; border-radius:8px; background:var(--green); color:white; font-weight:550; }
.secondary { padding:8px 12px; border:1px solid var(--line); background:white; border-radius:7px; }
.text-btn { color:var(--green); padding:5px 7px; font-size:12px; }
.muted { color:var(--muted); }
.tiny { font-size:11px; }
.flex { display:flex; align-items:center; gap:9px; }

.wordmark-dot { color:#8cac95; }
.lab-guide { min-height:52px; padding:10px 23px; display:flex; align-items:center; gap:18px; font-size:12px; }

.guide-title { font-weight:600; white-space:nowrap; }
.guide-detail { color:#70786f; }

#app { margin:0 16px; height:calc(100dvh - 150px); min-height:590px; background:#fff; border:1px solid #d8ded5; border-radius:13px; overflow:hidden; box-shadow:0 6px 22px #273b2810; }
.app-header { height:58px; display:flex; gap:16px; align-items:center; padding:0 22px; background:#fcfdfb; border-bottom:1px solid var(--line); }

<body>
<div class="prototype-intro">
  <span class="lab-label">第 01 项 · 基础工作区 v1</span>
  <div><strong>从第一次打开，到下次回来，是否顺手？</strong><p>沿用 A 布局，体验建任务、网页登录、退出重开和失败处理。网页、登录、保存与重开均为本页模拟。</p></div>
</div>
<main id="app" aria-label="helpr 基础工作区"></main>
<aside id="lab" class="prototype-controls" aria-label="原型体验控制"></aside>
<div id="task-preview-layer"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script id="prototype-model">
// PROTOTYPE ONLY. Pure transitions; "saved", browser sessions and website data all remain in memory.
const Foundation = (() => {
  const clone = value => structuredClone(value);
  const examples = [
    {goal:'准备发布十月经营周报',url:'https://beishan.example/wp-admin/'},
    {goal:'整理团队内部资料',url:'https://team.beishan.example/admin/'},
  ];
  const initial = () => ({
    app:'open',tasks:[],active:null,nextId:1,sessions:{},pages:{},websiteDrafts:{},
    saved:{tasks:[],active:null,nextId:1},save:'saved',protection:'available',
    faults:{network:null,credentials:false,storage:false},reopened:false,
    feedback:'',events:['已打开空工作区，AI 尚未配置。'],
  });
  function record(s,text) { s.events=[...s.events.slice(-19),text];s.feedback=text; }
  function checkpoint(s) {
    if(s.faults.storage){s.save='pending';return false;}
    s.saved=clone({tasks:s.tasks,active:s.active,nextId:s.nextId});s.save='saved';return true;
  }
  const task = (s,id) => s.tasks.find(t=>t.id===id);
  const websiteDirty = (s,id) => {
    const page=s.pages[id],saved=s.websiteDrafts[id];
    return !!page&&(page.title!==saved.title||page.body!==saved.body);
  };
  const pageFor = (s,t) => ({...clone(s.websiteDrafts[t.id]),error:s.faults.network===t.id});
  function transition(before,event) {
    const s=clone(before), t=task(s,event.id);
    if(s.app==='closed'&&!['OPEN','RESTORE_CONDITIONS'].includes(event.type))return s;
    switch(event.type) {
      case 'CREATE': {
        if(s.faults.storage){record(s,'新任务尚未创建，输入保留；恢复保存后可重试。');break;}
        const url=new URL(event.url);
        const id='task-'+s.nextId++,label=String.fromCharCode(64+s.tasks.length+1);
        const kind=url.hostname.startsWith('team.')?'drupal':url.hostname==='beishan.example'?'wordpress':'generic';
        const site=kind==='drupal'?'Drupal':kind==='wordpress'?'WordPress':url.hostname;
        const next={id,label,goal:event.goal,url:url.href,origin:url.origin,site,kind,hidden:false,minimized:false,draft:'',
          messages:[{role:'user',text:event.goal},{role:'system',text:'这项任务已建立。你可以先在网页中登录并手动处理；AI 尚未配置，对话会保存在这里。'}]};
        s.tasks.push(next);s.active=id;
        s.websiteDrafts[id]={title:kind==='drupal'?'十月经营周报 · 内部资料':'十月经营周报',body:'本周经营数据已整理完毕。请在这里补充要发布的内容。'};
        s.pages[id]=pageFor(s,next);checkpoint(s);
        record(s,'已创建任务 '+label+'，网页与对话独立保留。');break;
      }
      case 'SELECT': if(t){t.hidden=false;s.active=t.id;checkpoint(s);} break;
      case 'HIDE': if(t){t.hidden=true;if(s.active===t.id)s.active=s.tasks.find(x=>!x.hidden)?.id||null;checkpoint(s);record(s,'任务 '+t.label+' 已收起，原记录保留。');} break;
      case 'MINIMIZE': if(t){t.minimized=!t.minimized;checkpoint(s);} break;
      case 'CHAT_DRAFT': if(t){t.draft=event.value;checkpoint(s);} break;
      case 'SEND':
        if(t&&t.draft.trim()){
          t.messages.push({role:'user',text:t.draft.trim()});t.draft='';
          record(s,checkpoint(s)?'消息已保存到任务 '+t.label+'；尚未开始自动执行。':'消息仍在任务 '+t.label+' 的窗口中，尚未保存。');
        }break;
      case 'LOGIN':
        if(t&&s.protection==='available'&&!s.pages[t.id].error){
          s.sessions[t.origin]=true;record(s,t.site+' 的演示登录已建立；同一网站的任务共用这一登录。');
        }break;
      case 'LOGOUT':
        if(t){s.sessions[t.origin]=false;record(s,t.site+' 已退出网站账号；其它网站的登录不变。');}break;
      case 'WEB_INPUT':
        if(t&&s.sessions[t.origin]&&s.protection==='available'&&!s.pages[t.id].error)s.pages[t.id][event.field]=event.value;
        break;
      case 'SAVE_WEB':
        if(t&&s.sessions[t.origin]&&s.protection==='available'&&!s.pages[t.id].error){
          const p=s.pages[t.id];s.websiteDrafts[t.id]={title:p.title,body:p.body};
          record(s,'任务 '+t.label+' 的草稿已保存到模拟网站；未发布。');
        }break;
      case 'FAULT':
        if(event.kind==='network'&&t){s.faults.network=t.id;s.pages[t.id].error=true;record(s,'演示：任务 '+t.label+' 的网站暂时无法连接。');}
        if(event.kind==='credentials'){s.faults.credentials=true;s.protection='blocked';record(s,'演示：登录保护读取失败，暂不打开依赖该信息的网页。');}
        if(event.kind==='storage'){s.faults.storage=true;s.save='unavailable';record(s,'演示：本机记录暂时无法保存。');}
        if(event.kind==='expired'&&t){s.sessions[t.origin]=false;record(s,'演示：'+t.site+' 的登录已过期；任务与对话保留。');}
        break;
      case 'RESTORE_CONDITIONS':
        s.faults={network:null,credentials:false,storage:false};
        record(s,'模拟条件已恢复。回到工作区点击对应的重试，核对后恢复。');break;
      case 'RETRY_PAGE':
        if(t){
          if(s.protection!=='available'){record(s,'请先恢复登录信息的读取。');break;}
          s.pages[t.id].error=s.faults.network===t.id;
          record(s,s.pages[t.id].error?'仍无法连接，保留当前任务；可以先查看另一项。':'网页已重新打开，已有任务与对话保持不变。');
        }break;
      case 'RETRY_CREDENTIALS':
        s.protection=s.faults.credentials?'blocked':'available';
        record(s,s.protection==='blocked'?'仍无法读取登录信息，请完成系统授权后重试。':'登录信息已重新核对；有效会话保留，没有启动自动执行。');break;
      case 'RETRY_SAVE':
        record(s,checkpoint(s)?'未保存的改动已写入本机记录。':'仍无法保存，请保持窗口打开；新内容仍保留在窗口中。');break;
      case 'QUIT':
        if(!checkpoint(s)){record(s,'还有记录无法保存，已保留工作区，暂不退出。');break;}
        s.app='closed';s.pages={};
        record(s,'已保存任务与对话并模拟退出。未保存到网站的编辑不在恢复记录中。');break;
      case 'OPEN':
        s.tasks=clone(s.saved.tasks);s.active=s.saved.active;s.nextId=s.saved.nextId;
        s.pages=Object.fromEntries(s.tasks.map(x=>[x.id,pageFor(s,x)]));
        s.app='open';s.reopened=true;s.protection=s.faults.credentials?'blocked':'available';
        record(s,'已重新打开 '+s.tasks.length+' 项原任务，未创建重复任务，未启动自动执行。');break;
      case 'ACK_REOPEN': s.reopened=false;break;
    }
    return s;
  }
  function scenario(name) {
    let s=initial();
    if(name==='first')return s;
    for(const sample of examples){s=transition(s,{type:'CREATE',...sample});s=transition(s,{type:'LOGIN',id:s.active});}
    s=transition(s,{type:'SELECT',id:'task-1'});
    for(const [id,text] of [['task-1','先核对标题，确认后再处理。'],['task-2','这份只供团队内部查看。']]){
      s=transition(s,{type:'CHAT_DRAFT',id,value:text});s=transition(s,{type:'SEND',id});
    }
    s=transition(s,{type:'WEB_INPUT',id:'task-1',field:'title',value:'十月经营周报 · 已保存草稿'});
    s=transition(s,{type:'SAVE_WEB',id:'task-1'});
    if(name==='reopen')return transition(s,{type:'QUIT'});
    if(name==='expired'){s=transition(s,{type:'FAULT',kind:'expired',id:'task-1'});s=transition(s,{type:'QUIT'});return transition(s,{type:'OPEN'});}
    if(['network','credentials','storage'].includes(name))s=transition(s,{type:'FAULT',kind:name,id:'task-1'});
    if(name==='storage'){
      s=transition(s,{type:'CHAT_DRAFT',id:'task-1',value:'这条新要求还没有保存，请保留。'});
      s=transition(s,{type:'SEND',id:'task-1'});
    }
    return s;
  }
  return {initial,transition,scenario,task,websiteDirty,examples};
})();
</script>

function modalContent() {
  if(modal==='new')return {title:'创建一项网页任务',body:`<p>先说明要做的事，再打开对应网站。AI 尚未配置，你可以先登录和手动准备。</p><form data-create class="new-fields"><label for="new-goal">这次想做什么？</label><textarea id="new-goal" maxlength="160" placeholder="例如：准备发布这周的经营周报">${esc(newDraft.goal)}</textarea><label for="new-url">网站地址</label><input id="new-url" type="url" placeholder="https://..." value="${esc(newDraft.url)}" required><div class="example-options"><span>填入演示内容</span><button type="button" data-action="example" data-example="0">WordPress 示例</button><button type="button" data-action="example" data-example="1">Drupal 示例</button></div><p class="tiny">原型中所有地址都只显示本地模拟网站，不访问外部服务。</p><div class="form-error" role="status">${esc(formError)}</div><div class="modal-footer"><button type="button" class="secondary" ${act('dismiss')}>暂不创建</button><button type="submit" class="primary">创建并打开网站 ${icon('arrow')}</button></div></form>`};
  if(modal==='tasks')return {title:'我的任务',body:`<p>重新查看只恢复展示，不启动自动执行。</p>${model.tasks.map(t=>`<div class="activity-row">${siteIcon(t)}<div class="spacer"><strong class="task-name">${esc(t.goal)}</strong><div>${statusHTML(t)} <span class="tiny muted">· ${t.hidden?'已收起':'在工作区'}</span></div></div><button class="secondary" ${act('select',t.id)}>查看任务 ${t.label}</button></div>`).join('')||'<p>还没有任务，创建后会保留在这里。</p>'}`};
  if(modal==='close-task')return {title:'收起这项任务？',body:`<p>这项任务尚未自动执行。收起标签后，网页和对话仍保留在“任务”入口，随时可以回来查看。</p><div class="modal-footer"><button class="secondary" ${act('dismiss')}>返回</button><button class="primary" ${act('hide',modalTask)}>收起任务</button></div>`};
  if(modal==='quit'){
    const dirty=model.tasks.filter(t=>Foundation.websiteDirty(model,t.id));
    const failed=model.save!=='saved'||model.faults.storage;
    return {title:failed?'暂时还不能可靠保存':dirty.length?'网页中还有未保存的编辑':'退出 helpr',body:`<div class="exit-list"><div>${icon(failed?'info':'check')}${failed?'任务与对话有新内容尚未保存':'任务和对话已保存'}</div><div>${icon('lock')}仍有效的网站登录将在下次打开时核对</div></div>
      ${failed?'<p class="dialog-warning">请先恢复记录保存。当前窗口中的内容会保留，退出可能丢失尚未保存的要求。</p>':dirty.length?`<p class="dialog-warning">${dirty.map(t=>'任务 '+t.label).join('、')} 的草稿尚未保存到网站。先回网页保存；如果现在退出，这些网页编辑将丢失。</p>`:'<p>结束本次应用运行。下次打开时找回原任务，重新打开网页；不会自动开始执行。</p>'}
      <div class="modal-footer"><button class="secondary" ${act('dismiss')}>${failed?'保留工作区':dirty.length?'返回网页保存':'暂不退出'}</button>${failed?`<button class="primary" ${act('retry-save')}>重试保存</button>`:`<button class="primary" ${act('confirm-quit')}>${dirty.length?'放弃网页编辑并退出':'保存记录并退出'}</button>`}</div>`};
  }
  return null;
}
function openModal(name,id=null) { hidePreview();previousFocus=document.activeElement;modal=name;modalTask=id;renderModal(); }
function renderModal() {
  const content=modalContent();
  $('#overlay').innerHTML=content?`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${content.title}</h2><span class="spacer"></span><button class="icon-btn" ${act('dismiss')} aria-label="关闭弹窗">${icon('close')}</button></header>${content.body}</section></div>`:'';
  if(content)requestAnimationFrame(()=>($('.modal textarea')||$('.modal button'))?.focus());
}
function dismiss() { modal=null;modalTask=null;$('#overlay').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus(); }
function hidePreview(restore=false) {
  clearTimeout(preview.openTimer);clearTimeout(preview.closeTimer);
  const button=$('[data-preview-tab="'+preview.id+'"] .select-task');
  preview.id=null;preview.keyboard=false;$('#task-preview-layer').innerHTML='';
  $$('[data-preview-tab] .select-task').forEach(el=>el.setAttribute('aria-expanded','false'));
  if(restore)button?.focus();
}
function showPreview(id,keyboard=false) {
  clearTimeout(preview.openTimer);clearTimeout(preview.closeTimer);
  const t=task(id);if(!t||modal||model.app!=='open')return;
  if(preview.id===id){preview.keyboard=keyboard||preview.keyboard;return;}
  preview.id=id;preview.keyboard=keyboard;
  const ready=model.protection==='available'&&!model.pages[t.id]?.error;
  const rows=[[isRecorded(t),'任务与对话已保存'],[ready,'网页已打开'],[ready&&model.sessions[t.origin],'网站已登录']];
  $('#task-preview-layer').innerHTML=`<section id="task-preview-card" class="task-preview" role="dialog" tabindex="-1" aria-labelledby="preview-title"><header class="preview-header">${siteIcon(t)}<div class="spacer"><h2 id="preview-title">${esc(t.goal)}</h2><span>${esc(t.site)} · 任务 ${t.label}</span></div><button class="icon-btn" ${act('preview-close')} aria-label="收起进度卡片">${icon('close')}</button></header>
    <div class="preview-progress"><div class="preview-status">${statusHTML(t)}<span>网页准备情况</span></div><div class="progress-track"><div class="progress-fill" style="width:${rows.filter(r=>r[0]).length/3*100}%"></div></div><div class="step-list">${rows.map(([ok,label])=>`<div class="${ok?'complete':''}"><span class="step-circle"></span>${label}${ok?'':' · 待处理'}</div>`).join('')}</div></div>
    <div class="preview-update"><span>最近一条要求</span><p>${esc(t.messages.filter(m=>m.role==='user').at(-1)?.text||t.goal)}</p></div></section>`;
  positionPreview();$$('[data-preview-tab] .select-task').forEach(el=>el.setAttribute('aria-expanded',String(el.dataset.task===id)));
}
function positionPreview() {
  const card=$('#task-preview-card'),anchor=$('[data-preview-tab="'+preview.id+'"]');if(!card||!anchor)return;
  const box=anchor.getBoundingClientRect();card.style.left=Math.max(8,Math.min(box.left,innerWidth-card.offsetWidth-8))+'px';
  card.style.top=Math.max(8,box.bottom+8)+'px';card.style.maxHeight=Math.max(160,innerHeight-box.bottom-24)+'px';
}
function laterClose() {
  clearTimeout(preview.openTimer);clearTimeout(preview.closeTimer);if(preview.keyboard)return;
  preview.closeTimer=setTimeout(()=>{if(!document.activeElement.closest('.task-preview'))hidePreview();},180);
}
function retry(type,id) {
  dispatch({type,id});
  const feedback=$('[data-retry-feedback]');if(feedback)feedback.textContent=model.feedback;
  else toast(model.feedback);
}
const handlers={
  new:()=>{formError='';openModal('new');},
  example:(_,el)=>{newDraft={...Foundation.examples[Number(el.dataset.example)]};formError='';renderModal();},
  dismiss:()=>dismiss(),
  select:id=>{dismiss();dispatch({type:'SELECT',id});},
  tasks:()=>openModal('tasks'),
  'close-task':id=>openModal('close-task',id),
  hide:id=>{dismiss();dispatch({type:'HIDE',id},{announce:true});},
  minimize:id=>dispatch({type:'MINIMIZE',id}),
  logout:id=>dispatch({type:'LOGOUT',id},{announce:true}),
  'save-web':id=>dispatch({type:'SAVE_WEB',id},{announce:true}),
  'retry-page':id=>retry('RETRY_PAGE',id),
  'retry-credentials':()=>retry('RETRY_CREDENTIALS'),
  'retry-save':()=>retry('RETRY_SAVE'),
  'ack-reopen':()=>dispatch({type:'ACK_REOPEN'}),
  quit:()=>openModal('quit'),
  'confirm-quit':()=>{dismiss();dispatch({type:'QUIT'});},
  open:()=>dispatch({type:'OPEN'}),
  scene:(_,el)=>{dismiss();newDraft={goal:'',url:''};scene=el.dataset.scene;model=Foundation.scenario(scene);render();},
  restore:()=>dispatch({type:'RESTORE_CONDITIONS'},{announce:true}),
  'preview-close':()=>hidePreview(true),
};
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');
  if(target){handlers[target.dataset.action]?.(target.dataset.task,target);return;}
  if(event.target.matches('[data-backdrop]'))dismiss();
});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('[data-preview-tab],.task-preview'))hidePreview();});
document.addEventListener('pointerover',event=>{
  if(event.pointerType==='touch')return;
  const tab=event.target.closest('[data-preview-tab]');
  if(tab&&!tab.contains(event.relatedTarget)&&!preview.keyboard){
    clearTimeout(preview.openTimer);clearTimeout(preview.closeTimer);preview.openTimer=setTimeout(()=>showPreview(tab.dataset.previewTab),280);
  }
  if(event.target.closest('.task-preview'))clearTimeout(preview.closeTimer);
});
document.addEventListener('pointerout',event=>{
  const source=event.target.closest('[data-preview-tab],.task-preview');
  if(!source||source.contains(event.relatedTarget))return;
  if(event.relatedTarget?.closest?.('.task-preview')||event.relatedTarget?.closest?.('[data-preview-tab]')?.dataset.previewTab===preview.id)return;
  laterClose();
});
document.addEventListener('focusout',event=>{
  if(event.target.closest('.task-preview'))requestAnimationFrame(()=>{if(!document.activeElement.closest('.task-preview,[data-preview-tab]'))hidePreview();});
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='new-goal')newDraft.goal=el.value;
  if(el.id==='new-url')newDraft.url=el.value;
  if(el.dataset.chatDraft){
    dispatch({type:'CHAT_DRAFT',id:el.dataset.chatDraft,value:el.value},{repaint:false});
    $('[data-chat-save]').textContent=model.save==='saved'?'输入草稿已保存':'输入仍在本窗口中，尚未保存';
    $('[data-chat-save]').classList.toggle('pending',model.save!=='saved');
  }
  if(el.dataset.webField){
    dispatch({type:'WEB_INPUT',id:el.dataset.task,field:el.dataset.webField,value:el.value},{repaint:false});
    const label=$('[data-web-save="'+el.dataset.task+'"]'),dirty=Foundation.websiteDirty(model,el.dataset.task);
    label.textContent=dirty?'网页有未保存的修改':'草稿已在网站保存';label.classList.toggle('dirty',dirty);
  }
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.matches('[data-create]')){
    const goal=newDraft.goal.trim(),url=newDraft.url.trim();
    let validURL;try{validURL=new URL(url);}catch{}
    if(!goal||!validURL||!['http:','https:'].includes(validURL.protocol)){formError='请写下任务目标，并填写完整的 http 或 https 网站地址。';renderModal();return;}
    if(model.faults.storage){formError='目前无法保存新任务。输入已保留，请恢复保存后再次创建。';renderModal();return;}
    dismiss();dispatch({type:'CREATE',goal,url:validURL.href},{announce:true});newDraft={goal:'',url:''};
  }
  if(event.target.dataset.login)dispatch({type:'LOGIN',id:event.target.dataset.login},{announce:true});
  if(event.target.dataset.send){
    const id=event.target.dataset.send;dispatch({type:'SEND',id});
    $('[data-chat-draft="'+id+'"]')?.focus();
  }
});
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.key==='Escape'){if(preview.id)hidePreview(!!event.target.closest('.task-preview'));else dismiss();return;}
  if(event.key==='ArrowDown'&&event.target.matches('.task-tab .select-task')&&!modal){
    event.preventDefault();showPreview(event.target.dataset.task,true);$('#task-preview-card')?.focus();return;
  }
  if(event.key==='Enter'&&!event.shiftKey&&event.target.dataset.chatDraft){
    event.preventDefault();const id=event.target.dataset.chatDraft;dispatch({type:'SEND',id});$('[data-chat-draft="'+id+'"]')?.focus();return;
  }
  if(event.key==='Tab'&&modal){
    const items=$$('button,input,textarea,a[href]', $('.modal')).filter(el=>!el.disabled),first=items[0],last=items.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
window.addEventListener('resize',positionPreview);
window.addEventListener('scroll',positionPreview);
render();
</script>
</body>
</html>
