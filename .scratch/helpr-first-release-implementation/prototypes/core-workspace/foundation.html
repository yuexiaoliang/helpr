<style>
/* PROTOTYPE. Three deliberately different layouts share only visual tokens and task content. */
* { box-sizing: border-box; }
[hidden] { display:none!important; }
:root { --ink:#23352e; --muted:#78817b; --line:#e3e7e0; --green:#2b594b; --soft:#edf3ee; --amber:#a26b27; --paper:#fff; --background:#eeeee9; }
body { margin:0; color:var(--ink); background:var(--background); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
button,input,textarea,select { font:inherit; }
button { cursor:pointer; border:0; background:none; color:inherit; }

button:not(:disabled):hover { filter:brightness(.95); }

svg { width:18px; height:18px; vertical-align:middle; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn { width:30px; height:30px; display:inline-grid; place-items:center; border-radius:7px; }
.icon-btn:hover { background:#edf0eb; }
.primary { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 15px; border-radius:8px; background:var(--green); color:white; font-weight:550; }
.secondary { padding:8px 12px; border:1px solid var(--line); background:white; border-radius:7px; }
.text-btn { color:var(--green); padding:5px 7px; font-size:12px; }
.muted { color:var(--muted); }
.tiny { font-size:11px; }
.flex { display:flex; align-items:center; gap:9px; }

.wordmark-dot { color:#8cac95; }
.lab-guide { min-height:52px; padding:10px 23px; display:flex; align-items:center; gap:18px; font-size:12px; }

.guide-title { font-weight:600; white-space:nowrap; }
.guide-detail { color:#70786f; }

#app { margin:0 16px; height:calc(100dvh - 150px); min-height:590px; background:#fff; border:1px solid #d8ded5; border-radius:13px; overflow:hidden; box-shadow:0 6px 22px #273b2810; }
.app-header { height:58px; display:flex; gap:16px; align-items:center; padding:0 22px; background:#fcfdfb; border-bottom:1px solid var(--line); }

<div class="prototype-intro"><strong>只说目标，把空间留给网页。</strong><span>工作区 v2 · AI、网页与保存均为模拟</span></div>
<main id="app" aria-label="helpr 基础工作区"></main>

<script id="prototype-model">
// PROTOTYPE ONLY. These fixed examples illustrate AI decisions; no model or website is contacted.
const Foundation = (() => {
  const clone=value=>structuredClone(value);
  const sites=[
    {key:'wordpress',name:'北山官网',site:'WordPress',url:'https://beishan.example/wp-admin/',origin:'https://beishan.example'},
    {key:'drupal',name:'团队资料库',site:'Drupal',url:'https://team.beishan.example/admin/',origin:'https://team.beishan.example'},
  ];
  const examples=[
    {label:'只说网站名称',goal:'把十月经营周报发布到北山官网'},
    {label:'没说发到哪里',goal:'帮我发布十月经营周报'},
    {label:'网址有个笔误',goal:'把十月经营周报发到 https://beishna.example'},
    {label:'第二项任务',goal:'把这份内部资料整理到团队资料库'},
  ];
  const initial=()=>({app:'open',tasks:[],active:null,nextId:1,sessions:{},pages:{},websiteDrafts:{},
    saved:{tasks:[],active:null,nextId:1},save:'saved',protection:'available',ai:true,
    faults:{network:null,credentials:false,storage:false},reopened:false,feedback:'',
    events:['已打开空工作区；本轮使用预置的 AI 分析演示。']});
  function record(s,text){s.events=[...s.events.slice(-19),text];s.feedback=text;}
  function checkpoint(s){
    if(s.faults.storage){s.save='pending';return false;}
    s.saved=clone({tasks:s.tasks,active:s.active,nextId:s.nextId});s.save='saved';return true;
  }
  const task=(s,id)=>s.tasks.find(t=>t.id===id);
  const websiteDirty=(s,id)=>!!s.pages[id]&&(s.pages[id].title!==s.websiteDrafts[id].title||s.pages[id].body!==s.websiteDrafts[id].body);
  const pageFor=(s,t)=>({...clone(s.websiteDrafts[t.id]),error:s.faults.network===t.id});
  function openSite(s,t,key,reason){
    const site=sites.find(x=>x.key===key);if(!site)return;
    Object.assign(t,{url:site.url,origin:site.origin,site:site.site,kind:key,analysis:'ready',candidates:[]});
    if(!s.websiteDrafts[t.id])s.websiteDrafts[t.id]={title:key==='drupal'?'十月经营周报 · 内部资料':'十月经营周报',body:'本周经营数据已整理完毕。请在这里补充要发布的内容。'};
    s.pages[t.id]=pageFor(s,t);
    t.messages.push({role:'assistant',text:reason+' 我先打开网页；需要登录时，请直接在网页中完成。'});
    checkpoint(s);record(s,'任务 '+t.label+' 已确定网站：'+site.name+'。');
  }
  // Intentionally bounded fixture, not a reusable URL resolver or a substitute for a real model.
  function understand(text){
    if(/beishna\.example|beishan\.exmaple/i.test(text))return {kind:'correct',keys:['wordpress'],text:'你写的地址可能有个拼写错误。之前使用的北山官网是 beishan.example；你指的是这个网站吗？'};
    const hosts=[...text.matchAll(/(?:https?:\/\/)?([a-z0-9-]+(?:\.[a-z0-9-]+)+)/gi)].map(x=>x[1].toLowerCase());
    if(hosts.some(h=>!sites.some(x=>new URL(x.url).hostname===h)))return {kind:'clarify',keys:sites.map(x=>x.key),text:'这个地址暂时无法确认。你想使用哪个网站？可以告诉我网站名称或补充线索，不需要重新填写一张表单。'};
    const positive=text.replace(/(?:不是|不要发到|不发到|别发到)\s*(?:北山官网|北山|团队资料库|团队|WordPress|Drupal)/gi,'');
    const wp=/北山|官网|wordpress/i.test(positive)||hosts.includes('beishan.example');
    const dr=/团队|内部|资料库|drupal/i.test(positive)||hosts.includes('team.beishan.example');
    if(wp!==dr)return {kind:'ready',key:wp?'wordpress':'drupal'};
    return {kind:'clarify',keys:sites.map(x=>x.key),text:'要发布到哪个网站？我看到你之前使用过北山官网和团队资料库。可以直接选一个，也可以告诉我网站名称或用途。'};
  }
  function beginAnalysis(s,t,input){
    t.analysisInput=input;t.analysis=s.ai?'pending':'no-model';
    t.messages.push({role:'assistant',text:s.ai?'我来理解这个目标，并核对应该打开哪个网站。':'目标已保留。AI 尚未配置，配置后再分析网站；不会猜测地址。'});
    checkpoint(s);
  }
  function transition(before,event){
    const s=clone(before),t=task(s,event.id);
    if(s.app==='closed'&&!['OPEN','RESTORE_CONDITIONS'].includes(event.type))return s;
    switch(event.type){
      case 'CREATE':{
        if(s.faults.storage){record(s,'目标仍在输入框中，恢复保存后再创建任务。');break;}
        const id='task-'+s.nextId++,label=String.fromCharCode(65+s.tasks.length);
        const next={id,label,goal:event.goal,url:'',origin:'',site:'待确定网站',kind:'generic',analysis:'pending',candidates:[],
          hidden:false,minimized:false,draft:'',messages:[{role:'user',text:event.goal}]};
        s.tasks.push(next);s.active=id;beginAnalysis(s,next,event.goal);record(s,'已保存任务 '+label+' 的目标。');break;
      }
      case 'ANALYZE':{
        if(!t||t.analysis!=='pending')break;
        if(!s.ai){t.analysis='no-model';checkpoint(s);break;}
        if(s.faults.storage){t.analysis='paused';record(s,'先恢复任务记录保存，再继续分析。');break;}
        const answer=understand(t.analysisInput);
        if(answer.kind==='ready'){
          const site=sites.find(x=>x.key===answer.key);
          openSite(s,t,answer.key,'根据目标和之前使用的网站，我确定是'+site.name+'（'+new URL(site.url).hostname+'）。');
        }else{
          t.analysis=answer.kind;t.candidates=answer.keys;t.messages.push({role:'assistant',text:answer.text});
          checkpoint(s);record(s,'任务 '+t.label+' 正在等你补充网站信息。');
        }break;
      }
      case 'CHOOSE_SITE':
        if(t&&['clarify','correct'].includes(t.analysis)&&!s.faults.storage){
          const site=sites.find(x=>x.key===event.key);if(!site)break;
          t.messages.push({role:'user',text:t.analysis==='correct'?'是，使用'+site.name:'发到'+site.name});
          openSite(s,t,event.key,'已按你的回答确定为'+site.name+'（'+new URL(site.url).hostname+'）。');
        }break;
      case 'REJECT_SITE':
        if(t){t.analysis='clarify';t.candidates=[];t.messages.push({role:'user',text:'不是这个网站'},{role:'assistant',text:'好的，我先保留目标，不打开这个候选网站。请告诉我网站名称或补充线索。'});checkpoint(s);}break;
      case 'RESUME_ANALYSIS':if(t&&!s.faults.storage){beginAnalysis(s,t,t.analysisInput||t.goal);}break;
      case 'ENABLE_AI':
        s.ai=true;for(const x of s.tasks)if(x.analysis==='no-model')beginAnalysis(s,x,x.analysisInput||x.goal);
        record(s,'已启用模拟 AI，不涉及模型设置或真实调用。');break;
      case 'SELECT':if(t){t.hidden=false;s.active=t.id;checkpoint(s);}break;
      case 'HIDE':if(t){t.hidden=true;if(s.active===t.id)s.active=s.tasks.find(x=>!x.hidden)?.id||null;checkpoint(s);record(s,'任务 '+t.label+' 已收起，原记录保留。');}break;
      case 'MINIMIZE':if(t){t.minimized=!t.minimized;checkpoint(s);}break;
      case 'CHAT_DRAFT':if(t){t.draft=event.value;checkpoint(s);}break;
      case 'SEND':
        if(t&&t.draft.trim()){
          const text=t.draft.trim();t.messages.push({role:'user',text});t.draft='';
          if(!s.faults.storage&&['pending','clarify','correct','paused','no-model'].includes(t.analysis)){
            if(t.analysis==='correct'&&/^(是|是的|对|好的|没错|就是这个|是，使用北山官网|使用北山官网)[。！!\s]*$/.test(text))openSite(s,t,t.candidates[0],'已采用你确认的网站。');
            else beginAnalysis(s,t,text);
          }
          record(s,checkpoint(s)?'消息已保存到任务 '+t.label+'。':'新消息保留在任务 '+t.label+' 的窗口中，尚未保存。');
        }break;
      case 'LOGIN':if(t&&t.url&&s.protection==='available'&&!s.pages[t.id]?.error){s.sessions[t.origin]=true;record(s,t.site+' 演示登录已建立；同一网站的任务共用登录。');}break;
      case 'LOGOUT':if(t&&t.url){s.sessions[t.origin]=false;record(s,t.site+' 已退出账号，其它网站的登录不变。');}break;
      case 'WEB_INPUT':if(t&&s.pages[t.id]&&s.sessions[t.origin]&&s.protection==='available'&&!s.pages[t.id].error)s.pages[t.id][event.field]=event.value;break;
      case 'SAVE_WEB':if(t&&s.pages[t.id]&&s.sessions[t.origin]&&s.protection==='available'&&!s.pages[t.id].error){
        const p=s.pages[t.id];s.websiteDrafts[t.id]={title:p.title,body:p.body};record(s,'任务 '+t.label+' 的草稿已保存到模拟网站，尚未发布。');}break;
      case 'FAULT':
        if(event.kind==='network'&&s.pages[event.id]){s.faults.network=t.id;s.pages[t.id].error=true;record(s,'演示：任务 '+t.label+' 的网页暂时无法连接。');}
        if(event.kind==='credentials'){s.faults.credentials=true;s.protection='blocked';record(s,'演示：登录信息暂不可读取。');}
        if(event.kind==='storage'){s.faults.storage=true;s.save='unavailable';record(s,'演示：本机记录暂时无法保存。');}
        if(event.kind==='expired'&&t){s.sessions[t.origin]=false;record(s,'演示：'+t.site+' 的登录过期，任务与对话仍在。');}break;
      case 'RESTORE_CONDITIONS':s.faults={network:null,credentials:false,storage:false};record(s,'模拟条件已恢复，请回工作区重试。');break;
      case 'RETRY_PAGE':if(t&&s.pages[t.id]){
        if(s.protection!=='available'){record(s,'请先恢复登录信息的读取。');break;}
        s.pages[t.id].error=s.faults.network===t.id;record(s,s.pages[t.id].error?'仍无法连接，原任务已保留。':'网页已重新打开，任务与对话保持不变。');}break;
      case 'RETRY_CREDENTIALS':s.protection=s.faults.credentials?'blocked':'available';record(s,s.protection==='blocked'?'仍无法读取登录信息，请完成系统授权后重试。':'登录信息已核对，有效会话保留。');break;
      case 'RETRY_SAVE':record(s,checkpoint(s)?'窗口中的新内容已保存。':'仍无法保存，请保持窗口打开。');break;
      case 'QUIT':
        if(!checkpoint(s)){record(s,'仍有记录无法保存，暂不退出。');break;}
        s.app='closed';s.pages={};record(s,'任务与对话已保存，已模拟退出。');break;
      case 'OPEN':
        s.tasks=clone(s.saved.tasks);s.active=s.saved.active;s.nextId=s.saved.nextId;
        s.pages=Object.fromEntries(s.tasks.filter(x=>x.url).map(x=>[x.id,pageFor(s,x)]));
        for(const x of s.tasks)if(x.analysis==='pending')x.analysis='paused';
        s.app='open';s.reopened=true;s.protection=s.faults.credentials?'blocked':'available';
        checkpoint(s);record(s,'已找回 '+s.tasks.length+' 项原任务和对话，未启动网页执行。');break;
      case 'ACK_REOPEN':s.reopened=false;break;
    }
    return s;
  }
  function scenario(name){
    let s=initial();
    if(name==='first')return s;
    if(['ambiguous','typo','no-model'].includes(name)){
      if(name==='no-model')s.ai=false;
      s=transition(s,{type:'CREATE',goal:examples[name==='typo'?2:1].goal});
      return transition(s,{type:'ANALYZE',id:s.active});
    }
    for(const i of [0,3]){s=transition(s,{type:'CREATE',goal:examples[i].goal});s=transition(s,{type:'ANALYZE',id:s.active});s=transition(s,{type:'LOGIN',id:s.active});}
    s=transition(s,{type:'SELECT',id:'task-1'});
    for(const [id,text] of [['task-1','先核对标题，确认后再处理。'],['task-2','这份只供团队内部查看。']]){s=transition(s,{type:'CHAT_DRAFT',id,value:text});s=transition(s,{type:'SEND',id});}
    s=transition(s,{type:'WEB_INPUT',id:'task-1',field:'title',value:'十月经营周报 · 已保存草稿'});s=transition(s,{type:'SAVE_WEB',id:'task-1'});
    if(name==='reopen')return transition(s,{type:'QUIT'});
    if(name==='expired'){s=transition(s,{type:'FAULT',kind:'expired',id:'task-1'});s=transition(s,{type:'QUIT'});return transition(s,{type:'OPEN'});}
    if(['network','credentials','storage'].includes(name))s=transition(s,{type:'FAULT',kind:name,id:'task-1'});
    if(name==='storage'){s=transition(s,{type:'CHAT_DRAFT',id:'task-1',value:'这条新要求还没有保存，请保留。'});s=transition(s,{type:'SEND',id:'task-1'});}
    return s;
  }
  return {initial,transition,scenario,task,websiteDirty,examples,sites};
})();
</script>

<script>
// Throwaway presentation. No model calls, network requests, real credentials or persistent storage.
'use strict';
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const paths={plus:'M9 3v12M3 9h12',close:'m4 4 10 10M14 4 4 14',check:'m3 9 4 4 8-8',leaf:'M3 13C0 5 7 2 15 3c0 8-4 12-10 10m-2 3 8-10',lock:'M5 8V5a4 4 0 0 1 8 0v3M3 8h12v8H3Z',globe:'M1 9h16M9 1a8 8 0 1 0 0 16A8 8 0 0 0 9 1Zm0 0c-4 4-4 12 0 16 4-4 4-12 0-16Z',chat:'M3 3h12v9H7l-4 3V3Z',file:'M4 2h7l3 3v11H4V2Zm6 0v4h4M7 10h4M7 13h4',grid:'M2 2h5v5H2ZM11 2h5v5h-5ZM2 11h5v5H2ZM11 11h5v5h-5Z',replay:'M3 7a6 6 0 1 1 0 5M3 2v5h5',minus:'M4 9h10',send:'M9 14V3m-5 5 5-5 5 5',arrow:'M3 9h12m-5-5 5 5-5 5',exit:'M8 3H3v12h5M8 9h9m-4-4 4 4-4 4',info:'M9 8v5M9 5v.1M9 1a8 8 0 1 0 0 16A8 8 0 0 0 9 1',archive:'M2 4h14v3H2ZM4 7v9h10V7M7 10h4'};
const icon=name=>`<svg viewBox="0 0 18 18" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
const act=(name,id='')=>`data-action="${name}"${id?` data-task="${id}"`:''}`;
const logo=()=>`<div class="logo"><span class="logo-mark">${icon('leaf')}</span>helpr<span class="wordmark-dot">.</span></div>`;
let model=Foundation.initial(), scene='first',modal=null,modalTask=null,previousFocus=null;
let newDraft={goal:''},formError='',toastTimer,recoveryTimer,labOpen=false;
const analysisTimers=new Map();
const preview={id:null,openTimer:null,closeTimer:null,keyboard:false};
const task=id=>Foundation.task(model,id);
const current=()=>task(model.active);
const siteIcon=t=>`<span class="site-icon ${t.kind==='drupal'?'drupal':''}">${t.kind==='wordpress'?'W':t.kind==='drupal'?'d':icon('globe')}</span>`;
const isRecorded=t=>model.saved.tasks.some(x=>x.id===t.id)&&model.save==='saved';
function status(t) {
  if(t.analysis==='pending')return ['正在分析目标','checking'];
  if(t.analysis==='correct')return ['等待核对网站','manual'];
  if(t.analysis==='clarify')return ['待补充网站','manual'];
  if(t.analysis==='no-model')return ['等待配置 AI','ready'];
  if(t.analysis==='paused')return ['等待继续分析','ready'];
  if(model.protection==='blocked')return ['等待授权','manual'];
  if(model.pages[t.id]?.error)return ['网页打不开','manual'];
  if(!model.sessions[t.origin])return ['等待网页登录','ready'];
  return ['可手动操作','done'];
}
const statusHTML=t=>`<span class="status state-${status(t)[1]}"><i class="dot"></i>${status(t)[0]}</span>`;
function dispatch(event,{repaint=true,announce=false}={}) {
  model=Foundation.transition(model,event);
  if(repaint)render();else renderLab();
  if(announce&&model.feedback)toast(model.feedback);
}
function toast(text) {
  clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');
  toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3500);
}
function header() {
  return `<header class="app-header">${logo()}<nav class="task-tabs" aria-label="任务标签页">${model.tasks.filter(t=>!t.hidden).map(taskTab).join('')}<button class="icon-btn new-tab" ${act('new')} aria-label="新建任务" title="新建任务">${icon('plus')}</button></nav>
    <div class="header-tools"><span class="record-indicator ${model.save==='saved'?'':'pending'}" title="${model.save==='saved'?'任务与对话已保存':'有新内容尚未保存'}" aria-label="${model.save==='saved'?'任务与对话已保存':'有新内容尚未保存'}">${icon(model.save==='saved'?'check':'info')}</span><button class="activity-btn" ${act('tasks')} title="查看全部任务" aria-label="查看全部 ${model.tasks.length} 项任务">${icon('grid')}<span class="activity-count">${model.tasks.length}</span></button><button class="icon-btn" ${act('quit')} aria-label="退出 helpr" title="退出 helpr">${icon('exit')}</button></div>
  </header>`;
}
function taskTab(t) {
  return `<div class="task-tab ${model.active===t.id?'selected':''}" data-preview-tab="${t.id}">${siteIcon(t)}
    <button class="select-task" ${act('select',t.id)} aria-label="查看任务 ${t.label}：${esc(t.goal)}" aria-pressed="${model.active===t.id}" aria-expanded="false" aria-controls="task-preview-card" aria-keyshortcuts="ArrowDown" aria-description="按 Enter 切换任务，按下方向键查看进度"><span class="task-name">${esc(t.goal)}</span><small>${statusHTML(t)}</small></button>
    <button class="icon-btn" ${act('close-task',t.id)} aria-label="关闭任务 ${t.label}">${icon('close')}</button></div>`;
}
function notices() {
  let html='';
  if(model.save!=='saved')html+=`<div class="app-notice" role="status"><span>${icon('info')}</span><div class="notice-copy"><strong>新改动暂未保存</strong><small>内容仍在窗口中，请保持 helpr 打开。</small></div><button class="secondary" ${act('retry-save')}>重试</button></div>`;
  if(model.reopened)html+=`<div id="recovery-notice" class="app-notice recovered" role="status"><span>${icon('check')}</span><div class="notice-copy"><strong>已找回 ${model.tasks.length} 项任务和对话</strong><small>有效登录已保留，尚未自动执行。</small></div><button class="icon-btn" ${act('ack-reopen')} aria-label="收起恢复提示">${icon('close')}</button></div>`;
  return `<aside class="floating-notices" aria-label="工作区提示">${html}</aside>`;
}

  let choices='';
  if(['clarify','correct'].includes(t.analysis))choices=`<div class="site-choices">${t.candidates.map(key=>{const site=Foundation.sites.find(x=>x.key===key);return `<button ${act('choose-site',t.id)} data-site="${key}" ${model.faults.storage?'disabled':''}>${t.analysis==='correct'?'是，使用':''}${site.name}<small>${new URL(site.url).hostname}</small></button>`;}).join('')}${t.analysis==='correct'?`<button class="reject-site" ${act('reject-site',t.id)}>不是这个网站</button>`:''}</div>`;

function frame(t) {

}

  </div></section>`;

function scheduleAnalysis(){
  if(model.app==='open')for(const t of model.tasks){
    if(t.analysis!=='pending'||analysisTimers.has(t.id))continue;
    analysisTimers.set(t.id,setTimeout(()=>{analysisTimers.delete(t.id);dispatch({type:'ANALYZE',id:t.id});},800));
  }
  if(model.reopened&&!recoveryTimer)recoveryTimer=setTimeout(()=>{
    recoveryTimer=null;model=Foundation.transition(model,{type:'ACK_REOPEN'});$('#recovery-notice')?.remove();renderLab();
  },5500);
}
function clearPending(){for(const timer of analysisTimers.values())clearTimeout(timer);analysisTimers.clear();clearTimeout(recoveryTimer);recoveryTimer=null;}
function render() {
  const focus=document.activeElement,focusId=focus?.dataset.chatDraft,field=focus?.dataset.webField,start=focus?.selectionStart,end=focus?.selectionEnd;
  hidePreview();
  $('#app').innerHTML=model.app==='closed'?closed():header()+notices()+(current()&&!current().hidden?frame(current()):empty());
  renderLab();renderModal();const feed=$('[data-feed]');if(feed)feed.scrollTop=feed.scrollHeight;
  if(!modal){const next=focusId?$('[data-chat-draft="'+focusId+'"]'):field?$('[data-web-field="'+field+'"]'):null;if(next){next.focus();if(start!==null&&start!==undefined)next.setSelectionRange(start,end);}}
  scheduleAnalysis();
}
const scenes={first:'从头体验',ambiguous:'没说网站',typo:'网址写错',reopen:'退出后重开',network:'网页打不开',credentials:'登录保护失败',storage:'保存失败',expired:'登录过期','no-model':'AI 未配置'};
function guide(){
  if(model.faults.network||model.faults.credentials||model.faults.storage)return ['问题场景','可先重试，再到“原型场景”恢复模拟条件。'];
  if(model.save!=='saved'||model.protection==='blocked'||model.tasks.some(t=>model.pages[t.id]?.error))return ['条件已恢复','在工作区重试，查看是否保留原任务。'];
  if(model.app==='closed')return ['重新打开','点击“重新打开 helpr”查看原任务。'];
  if(!model.tasks.length)return ['开始体验','点击顶部 ＋ 或“创建第一个任务”，只写目标即可。'];
  const t=current();
  if(t?.analysis==='pending')return ['AI 分析演示','无需另填网址，稍后在该任务中显示判断。'];
  if(['clarify','correct'].includes(t?.analysis))return ['补充信息','在任务对话中回答或选择网站，仍是同一项任务。'];
  if(t?.analysis==='no-model')return ['目标已保留','可在“原型场景”启用模拟 AI，继续体验。'];
  if(t?.url&&!model.sessions[t.origin])return ['在网页登录','直接点击网页的“登录（模拟）”，无需真实账号。'];
  return ['自由体验','顶部 ＋ 新建任务；也可保存草稿、退出重开。'];
}
function renderLab(){

  $('#lab').innerHTML=`<div class="lab-compact"><span class="lab-mini-label">原型</span><strong>${title}</strong><span class="lab-instruction">${detail}</span><span class="spacer"></span><button class="lab-toggle" ${act('lab-toggle')} aria-expanded="${labOpen}" aria-controls="lab-panel">${icon('grid')} 原型场景</button></div>
    <section id="lab-panel" class="lab-panel" ${labOpen?'':'hidden'} aria-label="原型场景与记录"><div class="lab-panel-heading"><strong>切换体验场景</strong><button class="icon-btn" ${act('lab-toggle')} aria-label="收起原型场景">${icon('close')}</button></div><p>场景切换会重置演示。AI 使用预置示例和两个曾用网站的线索；所有数据仅在本页内存中。</p>
    <nav class="scene-bar" aria-label="体验场景">${Object.entries(scenes).map(([id,name])=>`<button class="scene-btn" data-action="scene" data-scene="${id}" aria-pressed="${scene===id}">${name}</button>`).join('')}</nav>
    <div class="lab-recovery"><button class="scene-btn restore" ${act('restore')} ${failure?'':'disabled'}>恢复模拟条件</button>${!model.ai?`<button class="scene-btn" ${act('enable-ai')}>启用模拟 AI</button>`:''}<a href="./index.html?variant=A">A / B / C 布局比较</a></div>
    <details class="state-details" ${wasOpen?'open':''}><summary>演示记录 · ${model.tasks.length} 项任务 · ${model.save==='saved'?'记录已保存':'记录未保存'}</summary><table><thead><tr><th>任务身份</th><th>网站</th><th>状态</th><th>对话</th></tr></thead><tbody>${model.tasks.map(t=>`<tr><td>${t.label} · ${t.id}</td><td>${esc(t.url?new URL(t.url).hostname:'待确定')}</td><td>${status(t)[0]}</td><td>${t.messages.filter(m=>m.role==='user').length} 条要求</td></tr>`).join('')||'<tr><td colspan="4">尚未创建任务</td></tr>'}</tbody></table><ul class="trace-list">${model.events.slice(-7).map(text=>`<li>· ${esc(text)}</li>`).join('')}</ul></details></section>`;

      ${failed?'<p class="dialog-warning">请先恢复记录保存。当前窗口中的内容会保留，退出可能丢失尚未保存的要求。</p>':dirty.length?`<p class="dialog-warning">${dirty.map(t=>'任务 '+t.label).join('、')} 的草稿尚未保存到网站。先回网页保存；如果现在退出，这些网页编辑将丢失。</p>`:'<p>结束本次应用运行。下次打开时找回原任务，重新打开网页；不会自动开始执行。</p>'}
      <div class="modal-footer"><button class="secondary" ${act('dismiss')}>${failed?'保留工作区':dirty.length?'返回网页保存':'暂不退出'}</button>${failed?`<button class="primary" ${act('retry-save')}>重试保存</button>`:`<button class="primary" ${act('confirm-quit')}>${dirty.length?'放弃网页编辑并退出':'保存记录并退出'}</button>`}</div>`};
  }

}
const handlers={
  new:()=>{formError='';openModal('new');},
  example:(_,el)=>{newDraft={...Foundation.examples[Number(el.dataset.example)]};formError='';renderModal();},
  dismiss:()=>dismiss(),
  select:id=>{dismiss();dispatch({type:'SELECT',id});},
  tasks:()=>openModal('tasks'),
  'close-task':id=>openModal('close-task',id),
  hide:id=>{dismiss();dispatch({type:'HIDE',id},{announce:true});},
  minimize:id=>dispatch({type:'MINIMIZE',id}),
  logout:id=>dispatch({type:'LOGOUT',id},{announce:true}),
  'save-web':id=>dispatch({type:'SAVE_WEB',id},{announce:true}),
  'retry-page':id=>retry('RETRY_PAGE',id),
  'retry-credentials':()=>retry('RETRY_CREDENTIALS'),
  'retry-save':()=>retry('RETRY_SAVE'),
  'ack-reopen':()=>{clearTimeout(recoveryTimer);recoveryTimer=null;dispatch({type:'ACK_REOPEN'});},
  'choose-site':(id,el)=>dispatch({type:'CHOOSE_SITE',id,key:el.dataset.site}),
  'reject-site':id=>dispatch({type:'REJECT_SITE',id}),
  'resume-analysis':id=>dispatch({type:'RESUME_ANALYSIS',id}),
  'lab-toggle':()=>{labOpen=!labOpen;renderLab();},
  'enable-ai':()=>{labOpen=false;dispatch({type:'ENABLE_AI'});},
  quit:()=>openModal('quit'),
  'confirm-quit':()=>{dismiss();clearPending();dispatch({type:'QUIT'});},
  open:()=>dispatch({type:'OPEN'}),
  scene:(_,el)=>{dismiss();clearPending();newDraft={goal:''};labOpen=false;scene=el.dataset.scene;model=Foundation.scenario(scene);render();},
  restore:()=>{labOpen=false;dispatch({type:'RESTORE_CONDITIONS'},{announce:true});},
  'preview-close':()=>hidePreview(true),
};
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');
  if(target){handlers[target.dataset.action]?.(target.dataset.task,target);return;}
  if(event.target.matches('[data-backdrop]'))dismiss();
});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('[data-preview-tab],.task-preview'))hidePreview();});
document.addEventListener('pointerover',event=>{
  if(event.pointerType==='touch')return;
  const tab=event.target.closest('[data-preview-tab]');
  if(tab&&!tab.contains(event.relatedTarget)&&!preview.keyboard){
    clearTimeout(preview.openTimer);clearTimeout(preview.closeTimer);preview.openTimer=setTimeout(()=>showPreview(tab.dataset.previewTab),280);
  }
  if(event.target.closest('.task-preview'))clearTimeout(preview.closeTimer);
});
document.addEventListener('pointerout',event=>{
  const source=event.target.closest('[data-preview-tab],.task-preview');
  if(!source||source.contains(event.relatedTarget))return;
  if(event.relatedTarget?.closest?.('.task-preview')||event.relatedTarget?.closest?.('[data-preview-tab]')?.dataset.previewTab===preview.id)return;
  laterClose();
});
document.addEventListener('focusout',event=>{
  if(event.target.closest('.task-preview'))requestAnimationFrame(()=>{if(!document.activeElement.closest('.task-preview,[data-preview-tab]'))hidePreview();});
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='new-goal')newDraft.goal=el.value;
  if(el.dataset.chatDraft){
    dispatch({type:'CHAT_DRAFT',id:el.dataset.chatDraft,value:el.value},{repaint:false});
    $('[data-chat-save]').textContent=model.save==='saved'?'输入草稿已保存':'输入仍在本窗口中，尚未保存';
    $('[data-chat-save]').classList.toggle('pending',model.save!=='saved');
  }
  if(el.dataset.webField){
    dispatch({type:'WEB_INPUT',id:el.dataset.task,field:el.dataset.webField,value:el.value},{repaint:false});
    const label=$('[data-web-save="'+el.dataset.task+'"]'),dirty=Foundation.websiteDirty(model,el.dataset.task);
    label.textContent=dirty?'网页有未保存的修改':'草稿已在网站保存';label.classList.toggle('dirty',dirty);
  }
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.matches('[data-create]')){
    const goal=newDraft.goal.trim();
    if(!goal){formError='请写下你想完成的目标。';renderModal();return;}
    if(model.faults.storage){formError='目前无法保存新任务。目标已保留，请恢复保存后再次创建。';renderModal();return;}
    dismiss();dispatch({type:'CREATE',goal});newDraft={goal:''};
  }
  if(event.target.dataset.login)dispatch({type:'LOGIN',id:event.target.dataset.login},{announce:true});
  if(event.target.dataset.send){
    const id=event.target.dataset.send;dispatch({type:'SEND',id});
    $('[data-chat-draft="'+id+'"]')?.focus();
  }
});
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.key==='Escape'){if(preview.id)hidePreview(!!event.target.closest('.task-preview'));else if(labOpen){labOpen=false;renderLab();}else dismiss();return;}
  if(event.key==='ArrowDown'&&event.target.matches('.task-tab .select-task')&&!modal){
    event.preventDefault();showPreview(event.target.dataset.task,true);$('#task-preview-card')?.focus();return;
  }
  if(event.key==='Enter'&&!event.shiftKey&&event.target.dataset.chatDraft){
    event.preventDefault();const id=event.target.dataset.chatDraft;dispatch({type:'SEND',id});$('[data-chat-draft="'+id+'"]')?.focus();return;
  }
  if(event.key==='Tab'&&modal){
    const items=$$('button,input,textarea,a[href]', $('.modal')).filter(el=>!el.disabled),first=items[0],last=items.at(-1);
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
window.addEventListener('resize',positionPreview);
window.addEventListener('scroll',positionPreview);
render();
</script>
</body>
</html>
