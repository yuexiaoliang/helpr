<aside class="guide" id="guide" hidden aria-label="原型体验指南"><div class="row"><div class="grow"><div class="guide-mark">EXECUTION · 03</div><h2>停止之后，怎样接着做？</h2></div><button class="icon" id="close-guide" aria-label="关闭体验指南">×</button></div><p class="intro">本演示核对：两项同时推进、第三项排队；停止约束本任务的后续操作，已送出结果如实保留；“继续”先核对，再做剩余部分。</p><div class="scenarios" role="tablist" aria-label="演练场景" id="scenarios"></div><div class="walk"><div class="steps" id="steps"></div><strong id="walk-title"></strong><p id="walk-copy"></p><button class="primary" id="walk-next"></button></div><div class="state-grid" id="state-grid" aria-label="完整演示状态"></div><div class="event-note" id="event-note" role="status"></div><div class="free-play"><div class="free-label">自由操作 · 当前任务 <b id="active-label">A</b></div><div class="row"><button class="secondary" id="advance">推进一次</button><button class="secondary" id="continue-task">继续本任务</button><button class="secondary" id="late-result">送达先前结果</button></div><div class="free-label">模拟条件（只影响演示）</div><div class="row"><select id="condition" aria-label="模拟条件"><option value="normal">恢复正常回执</option><option value="unknown">本任务提交结果不明</option><option value="slow">延迟本任务网站回执</option><option value="storage">本机记录保存失败</option></select><button class="secondary" id="apply-condition">应用条件</button><button class="secondary" id="resolve-result">核对：网站已完成</button><button class="secondary" id="restore-save">恢复保存</button></div></div><p class="footer">“推进一次”同时推动运行中的任务。无自动计时，无持久保存，刷新即重置。原生人工接管、真实模型／网页执行及重开恢复不在本原型中。指南与条件按钮是原型工具。</p></aside>

$('draft').oninput=e=>{state=ExecutionDemo.act(state,{type:'draft',text:e.target.value});};$('draft').oncompositionstart=()=>composing=true;$('draft').oncompositionend=()=>composing=false;$('compose').onsubmit=e=>{e.preventDefault();if(composing)return;const text=$('draft').value.trim();if(text)dispatch({type:'user',text});};
$('minimize').onclick=()=>dispatch({type:'collapse',value:true});$('expand-chat').onclick=()=>dispatch({type:'collapse',value:false});$('reset').onclick=()=>newScenario(scenario);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('preview').hidden=true;toggleGuide(false);}});
render();
</script></body></html>
