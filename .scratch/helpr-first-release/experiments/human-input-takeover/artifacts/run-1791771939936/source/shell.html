<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>helpr 人工接管核对</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:#152c45;color:white}.top{height:108px;padding:12px 20px}header{display:flex;align-items:center;gap:10px}h1{font-size:18px;margin:0 18px 0 0}button{font:13px system-ui;padding:6px 10px;border:1px solid #708297;border-radius:6px;background:#294664;color:white;cursor:pointer}button[aria-pressed=true]{background:#176b58;border-color:#8aead0}.status{margin-left:auto;display:flex;gap:18px}#guide{margin-top:10px;font-size:15px;color:#d7eaf8}#phase{color:#8aead0;margin-right:10px}</style>
<div class="top"><header><h1>helpr 人工接管核对</h1><button type="button" data-view="split">同时查看</button><button type="button" data-view="A">只看 A</button><button type="button" data-view="B">只看 B</button><div class="status"><span id="a"></span><span id="b"></span></div></header><div id="guide"><strong id="phase"></strong><span id="instruction">正在准备自动检查。</span></div></div>
<script>
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>window.takeoverLab.command('view',button.dataset.view));
window.takeoverLab.onState(s=>{document.querySelector('#phase').textContent=s.phaseLabel;document.querySelector('#instruction').textContent=s.instruction;document.querySelector('#a').textContent='A：'+s.a;document.querySelector('#b').textContent='B：'+s.b;for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===s.viewMode));});
</script></html>
